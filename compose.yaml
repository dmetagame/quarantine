services:
  hydradb:
    image: ${HYDRA_IMAGE:?set HYDRA_IMAGE in .env.deploy}
    user: "${HYDRA_UID:-1000}:${HYDRA_GID:-1000}"
    restart: unless-stopped
    init: true
    expose:
      - "8443"
      - "9090"
    ports:
      - "127.0.0.1:${HYDRA_HTTP_PORT:-18443}:8443"
      - "127.0.0.1:${HYDRA_ADMIN_PORT:-19091}:9090"
    secrets:
      - hydra-auth-token
    volumes:
      - "${HYDRA_DATA_DIR:?set HYDRA_DATA_DIR}:/data"
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: "${HYDRA_NAMESPACE:-default}"
      GRAPH_ID: "${HYDRA_GRAPH_ID:-default}"
      GRAPH_CELL_ID: "${HYDRA_CELL_ID:-cell-0}"
      GRAPH_CELLS: "${HYDRA_CELL_ID:-cell-0}"
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /run/secrets/hydra-auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      hydradb:
        condition: service_started
    ports:
      - "${QUARANTINE_DEMO_BIND:-127.0.0.1}:${QUARANTINE_DEMO_PORT:-4173}:4173"
    secrets:
      - hydra-auth-token
      - provenance-signing-key
      - connector-attestation-key
    environment:
      NODE_ENV: production
      QUARANTINE_DEMO_HOST: 0.0.0.0
      QUARANTINE_DEMO_PORT: 4173
      HYDRA_HTTP_URL: http://hydradb:8443
      HYDRA_ADMIN_URL: http://hydradb:9090
      HYDRA_NAMESPACE: "${HYDRA_NAMESPACE:-default}"
      HYDRA_GRAPH_ID: "${HYDRA_GRAPH_ID:-default}"
      HYDRA_CELL_ID: "${HYDRA_CELL_ID:-cell-0}"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        export HYDRA_AUTH_TOKEN="$$(cat /run/secrets/hydra-auth-token)"
        export QUARANTINE_PROVENANCE_SIGNING_KEY="$$(cat /run/secrets/provenance-signing-key)"
        export QUARANTINE_CONNECTOR_ATTESTATION_KEY="$$(cat /run/secrets/connector-attestation-key)"
        exec node scripts/demo-server.mjs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

secrets:
  hydra-auth-token:
    file: ${HYDRA_AUTH_TOKEN_FILE:?set HYDRA_AUTH_TOKEN_FILE}
  provenance-signing-key:
    file: ${QUARANTINE_PROVENANCE_SIGNING_KEY_FILE:?set QUARANTINE_PROVENANCE_SIGNING_KEY_FILE}
  connector-attestation-key:
    file: ${QUARANTINE_CONNECTOR_ATTESTATION_KEY_FILE:?set QUARANTINE_CONNECTOR_ATTESTATION_KEY_FILE}
